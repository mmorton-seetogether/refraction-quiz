<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refraction Assessment</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1c2233;
    --muted: #5a6275;
    --border: #d6dae4;
    --accent: #314a9f;
    --accent-text: #ffffff;
    --accent-soft: #e8ecf8;
    --ok: #1d6b3a;
    --ok-soft: #e3f3e8;
    --bad: #a3261f;
    --bad-soft: #fbe7e5;
    --focus: #f0a400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151d;
      --card: #1b2030;
      --text: #e9ecf3;
      --muted: #a6aec0;
      --border: #343b50;
      --accent: #8fa6f0;
      --accent-text: #10152a;
      --accent-soft: #263055;
      --ok: #7fd49b;
      --ok-soft: #173424;
      --bad: #f29b93;
      --bad-soft: #3d1c1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }

  .progress { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 20px; }
  .section { text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
  .qid { font-size: 1.25rem; margin: 0 0 10px; }
  .stem p { margin: 0 0 10px; }
  .stem ul { margin: 0 0 12px; padding-left: 1.2em; }
  .stem li { font-variant-numeric: tabular-nums; }

  fieldset { border: 0; padding: 0; margin: 14px 0 0; }
  legend, .sr { position: absolute; left: -9999px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start;
    border: 2px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
    background: var(--card);
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .letter {
    flex: none; width: 1.9em; height: 1.9em; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700;
    border: 2px solid var(--border); color: var(--muted);
  }
  .opt .txt { flex: 1; padding-top: .1em; }
  .opt .tag { display: block; font-size: .85rem; font-weight: 700; margin-top: 2px; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

  .locked .opt { cursor: default; }
  .locked .opt:hover { border-color: var(--border); }
  .opt.correct { border-color: var(--ok) !important; background: var(--ok-soft) !important; }
  .opt.correct .letter { background: var(--ok) !important; border-color: var(--ok) !important; color: var(--card) !important; }
  .opt.correct .tag { color: var(--ok); }
  .opt.wrong { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
  .opt.wrong .letter { background: var(--bad) !important; border-color: var(--bad) !important; color: var(--card) !important; }
  .opt.wrong .tag { color: var(--bad); }

  .feedback { margin: 6px 0 0; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .feedback:empty { display: none; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok); }
  .feedback.bad { background: var(--bad-soft); color: var(--bad); }

  .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--accent); color: var(--accent-text);
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  details.nav { margin-top: 20px; }
  details.nav summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 10px; }
  .grid button {
    padding: 6px 0; font-size: .9rem; font-weight: 600;
    background: var(--card); color: var(--text); border: 2px solid var(--border);
  }
  .grid button.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .grid button.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .grid button.current { outline: 3px solid var(--accent); outline-offset: 1px; }
  .legend { font-size: .85rem; color: var(--muted); margin-top: 8px; }

  .score { font-size: 2.4rem; font-weight: 800; margin: 4px 0 2px; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: .95rem; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .missed { padding-left: 1.2em; }
  .missed li { margin-bottom: 6px; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 600; }
  .hint { font-size: .85rem; color: var(--muted); margin-top: 14px; }
  @media (max-width: 480px) { .hint { display: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Refraction final assessment</h1>
  <p class="sub">Choose an answer, then select <strong>Submit</strong> to see the correct answer.</p>

  <div id="quiz">
    <div class="progress"><span id="pos"></span><span id="tally"></span></div>
    <div class="bar" aria-hidden="true"><span id="barfill"></span></div>

    <div class="card" id="card">
      <p class="section" id="section"></p>
      <h2 class="qid" id="qid"></h2>
      <div class="stem" id="stem"></div>
      <fieldset id="opts"><legend id="legend"></legend></fieldset>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" class="secondary" id="prev">Previous</button>
        <button type="button" id="main" disabled>Submit</button>
      </div>
      <p class="hint">Keyboard: A–D to choose, Enter to submit or go to the next question.</p>
    </div>

    <details class="nav">
      <summary>Go to a question</summary>
      <div class="grid" id="grid"></div>
      <p class="legend">Green = correct, red = incorrect, white = not answered.</p>
    </details>
  </div>

  <div id="results" class="card" hidden tabindex="-1"></div>
</main>

<script src="questions.js"></script>
<script>
(function () {
  const Q = window.QUESTIONS || [];
  const LETTERS = "ABCDEFGH";
  const chosen = new Array(Q.length).fill(null);   // selected option index
  const submitted = new Array(Q.length).fill(false);
  let i = 0;

  const $ = (id) => document.getElementById(id);
  if (window.QUIZ_TITLE) { $("title").textContent = window.QUIZ_TITLE; }

  // Build the question navigator once.
  Q.forEach((q, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n + 1;
    b.addEventListener("click", () => { go(n); });
    $("grid").appendChild(b);
  });

  function esc(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // Short "lens: VA" lines (e.g. "−1.25 D: 6/6") are shown as a list.
  function renderStem(lines) {
    let html = "", list = [];
    const flush = () => { if (list.length) { html += "<ul>" + list.map((l) => "<li>" + esc(l) + "</li>").join("") + "</ul>"; list = []; } };
    lines.forEach((l) => {
      if (/^[+\u2212-]?\d[\d.]*\s*D:\s*\S+$/.test(l)) { list.push(l); } else { flush(); html += "<p>" + esc(l) + "</p>"; }
    });
    flush();
    return html;
  }

  function correctCount() {
    return Q.reduce((n, q, k) => n + (submitted[k] && chosen[k] === q.answer ? 1 : 0), 0);
  }
  function answeredCount() { return submitted.filter(Boolean).length; }

  function render() {
    const q = Q[i];
    const done = submitted[i];
    $("pos").textContent = "Question " + (i + 1) + " of " + Q.length;
    $("tally").textContent = answeredCount() ? "Score: " + correctCount() + " / " + answeredCount() + " answered" : "";
    $("barfill").style.width = (answeredCount() / Q.length * 100) + "%";

    $("section").textContent = q.section || "";
    $("qid").textContent = q.id || "Q" + (i + 1);
    $("stem").innerHTML = renderStem(q.stem);
    $("legend").textContent = "Answer options for " + (q.id || "question " + (i + 1));

    const fs = $("opts");
    fs.querySelectorAll(".opt").forEach((el) => el.remove());
    fs.classList.toggle("locked", done);
    q.options.forEach((text, k) => {
      const label = document.createElement("label");
      label.className = "opt";
      let tag = "";
      if (done && k === q.answer) { label.classList.add("correct"); tag = chosen[i] === k ? "✓ Your answer — correct" : "✓ Correct answer"; }
      else if (done && k === chosen[i]) { label.classList.add("wrong"); tag = "✗ Your answer — incorrect"; }
      label.innerHTML =
        '<input type="radio" name="opt" value="' + k + '"' + (chosen[i] === k ? " checked" : "") + (done ? " disabled" : "") + ">" +
        '<span class="letter" aria-hidden="true">' + LETTERS[k] + "</span>" +
        '<span class="txt"><span class="sr">' + LETTERS[k] + ". </span>" +
        esc(text) + (tag ? '<span class="tag">' + tag + "</span>" : "") + "</span>";
      label.querySelector("input").addEventListener("change", () => { chosen[i] = k; $("main").disabled = false; });
      fs.appendChild(label);
    });

    const fb = $("feedback");
    if (done) {
      const right = chosen[i] === q.answer;
      fb.className = "feedback " + (right ? "ok" : "bad");
      fb.textContent = right ? "Correct." : "Incorrect. The correct answer is " + LETTERS[q.answer] + ": " + q.options[q.answer];
    } else {
      fb.className = "feedback";
      fb.textContent = "";
    }

    const main = $("main");
    if (!done) { main.textContent = "Submit"; main.disabled = chosen[i] === null; }
    else if (answeredCount() === Q.length) { main.textContent = "See results"; main.disabled = false; }
    else { main.textContent = i === Q.length - 1 ? "Next unanswered" : "Next question"; main.disabled = false; }
    $("prev").disabled = i === 0;

    [...$("grid").children].forEach((b, k) => {
      b.className = submitted[k] ? (chosen[k] === Q[k].answer ? "ok" : "bad") : "";
      if (k === i) b.classList.add("current");
      b.setAttribute("aria-label", "Question " + (k + 1) + (submitted[k] ? (chosen[k] === Q[k].answer ? ", correct" : ", incorrect") : ", not answered"));
      if (k === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
  }

  function go(n) {
    i = Math.max(0, Math.min(Q.length - 1, n));
    $("results").hidden = true;
    $("quiz").hidden = false;
    render();
    $("qid").scrollIntoView({ block: "nearest" });
  }

  function nextUnanswered() {
    for (let k = 1; k <= Q.length; k++) {
      const n = (i + k) % Q.length;
      if (!submitted[n]) return n;
    }
    return -1;
  }

  $("main").addEventListener("click", () => {
    if (!submitted[i]) {
      if (chosen[i] === null) return;
      submitted[i] = true;
      render();
      $("main").focus();
      return;
    }
    if (answeredCount() === Q.length) { showResults(); return; }
    const n = (i < Q.length - 1 && !submitted[i + 1]) ? i + 1 : nextUnanswered();
    go(n);
    const first = $("opts").querySelector("input");
    if (first) first.focus();
  });
  $("prev").addEventListener("click", () => go(i - 1));

  document.addEventListener("keydown", (e) => {
    if ($("quiz").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.tagName === "BUTTON" && e.key === "Enter") return; // let buttons handle themselves
    const k = LETTERS.indexOf(e.key.toUpperCase());
    if (k >= 0 && k < Q[i].options.length && !submitted[i] && e.key.length === 1) {
      const input = $("opts").querySelectorAll("input")[k];
      input.checked = true; input.focus();
      chosen[i] = k; $("main").disabled = false;
      e.preventDefault();
    } else if (e.key === "Enter" && !$("main").disabled) {
      e.preventDefault();
      $("main").click();
    }
  });

  function showResults() {
    const total = Q.length, score = correctCount();
    const sections = [];
    Q.forEach((q, k) => {
      let s = sections.find((x) => x.name === q.section);
      if (!s) { s = { name: q.section, n: 0, ok: 0 }; sections.push(s); }
      s.n++; if (chosen[k] === q.answer) s.ok++;
    });
    const missed = Q.map((q, k) => k).filter((k) => chosen[k] !== Q[k].answer);

    const r = $("results");
    r.innerHTML =
      '<h2 class="qid">Results</h2>' +
      '<p class="score">' + score + " / " + total + "</p>" +
      '<p class="sub">' + Math.round(score / total * 100) + "% correct</p>" +
      "<table><thead><tr><th>Section</th><th class=\"num\">Correct</th></tr></thead><tbody>" +
      sections.map((s) => "<tr><td>" + esc(s.name || "") + '</td><td class="num">' + s.ok + " / " + s.n + "</td></tr>").join("") +
      "</tbody></table>" +
      (missed.length
        ? "<h3>Questions to review</h3><ul class=\"missed\">" + missed.map((k) =>
            '<li><button type="button" class="linkish" data-q="' + k + '">' + esc(Q[k].id) + "</button> — you chose " +
            LETTERS[chosen[k]] + ", correct answer " + LETTERS[Q[k].answer] + "</li>").join("") + "</ul>"
        : "<p>You answered every question correctly.</p>") +
      '<div class="actions"><button type="button" class="secondary" id="review">Review all answers</button>' +
      '<button type="button" id="restart">Start again</button></div>';
    r.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => go(+b.dataset.q)));
    $("review").addEventListener("click", () => go(0));
    $("restart").addEventListener("click", () => {
      if (!confirm("Clear all answers and start again?")) return;
      chosen.fill(null); submitted.fill(false); go(0);
    });
    $("quiz").hidden = true;
    r.hidden = false;
    r.focus();
    window.scrollTo(0, 0);
  }

  if (!Q.length) {
    $("quiz").innerHTML = '<p class="card">No questions found. Check that questions.js is next to index.html.</p>';
  } else {
    render();
  }
})();
</script>
</body>
</html>
